<!DOCTYPE html>
<html>
<head>
  <title>Image Editor</title>
  <style>
    body { font-family: sans-serif; background: #222; color: #fff; padding: 20px; }
    canvas { border: 1px solid #555; background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    textarea { width: 100%; height: 150px; background: #333; color: #fff; }
  </style>
</head>
<body>
  <h1>Logo Editor</h1>
  <div style="display: flex; gap: 20px;">
    <div>
      <h3>Original Image</h3>
      <img id="orig" src="LogoMenu3.ico" style="max-width: 200px; border: 1px solid #555;" />
    </div>
    <div>
      <h3>Processed (256x256, Transparent, Enlarged)</h3>
      <canvas id="canvas" width="256" height="256"></canvas>
    </div>
  </div>
  
  <h3>Base64 PNG Data</h3>
  <textarea id="output" readonly></textarea>

  <script>
    const img = document.getElementById('orig');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const output = document.getElementById('output');

    img.onload = function() {
      // 1. Draw original image to temporary canvas at original size
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = img.naturalWidth || img.width || 256;
      tempCanvas.height = img.naturalHeight || img.height || 256;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(img, 0, 0);

      const width = tempCanvas.width;
      const height = tempCanvas.height;
      const imgData = tempCtx.getImageData(0, 0, width, height);
      const data = imgData.data;

      // 2. Detect background color from top-left corner pixel
      const bgR = data[0];
      const bgG = data[1];
      const bgB = data[2];
      const bgA = data[3];

      // 3. Remove background (make transparent)
      const tolerance = 40; // color distance tolerance
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const a = data[i+3];

        const dist = Math.sqrt(
          Math.pow(r - bgR, 2) +
          Math.pow(g - bgG, 2) +
          Math.pow(b - bgB, 2)
        );

        if (dist < tolerance) {
          data[i+3] = 0; // set alpha to 0
        }
      }
      tempCtx.putImageData(imgData, 0, 0);

      // 4. Find bounding box of non-transparent content to "enlarge" the logo
      let minX = width, maxX = 0, minY = height, maxY = 0;
      let hasContent = false;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = (y * width + x) * 4;
          const alpha = data[idx + 3];
          if (alpha > 10) { // non-transparent threshold
            hasContent = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (!hasContent) {
        minX = 0; maxX = width; minY = 0; maxY = height;
      }

      const contentWidth = (maxX - minX) + 1;
      const contentHeight = (maxY - minY) + 1;

      // 5. Draw cropped and scaled logo to final 256x256 canvas
      ctx.clearRect(0, 0, 256, 256);
      
      // Calculate scaling to fit 256x256 while keeping aspect ratio
      const scale = Math.min(256 / contentWidth, 256 / contentHeight);
      const drawWidth = contentWidth * scale;
      const drawHeight = contentHeight * scale;
      const drawX = (256 - drawWidth) / 2;
      const drawY = (256 - drawHeight) / 2;

      ctx.drawImage(
        tempCanvas,
        minX, minY, contentWidth, contentHeight, // source rect
        drawX, drawY, drawWidth, drawHeight      // dest rect
      );

      // 6. Export as base64 PNG
      const base64Png = canvas.toDataURL('image/png');
      output.value = base64Png;
      
      // Add a hidden element to confirm load is complete
      const flag = document.createElement('div');
      flag.id = 'status-complete';
      document.body.appendChild(flag);
    };

    // Trigger load if cached
    if (img.complete) {
      img.onload();
    }
  </script>
</body>
</html>
